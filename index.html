
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Finder</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:35px 15px;background:linear-gradient(135deg,#18264a,#39216b)}
h1{font-size:34px;margin:0}
header p{color:#c5c9dc}
main{max-width:750px;margin:25px auto;padding:0 15px}
nav{display:flex;gap:8px;margin-bottom:18px}
button{border:0;border-radius:10px;padding:12px 16px;background:#7663ff;color:white;font-weight:bold;cursor:pointer}
nav button{flex:1;background:#202943}
nav button.active{background:#7663ff}
.panel{background:#151e33;padding:18px;border-radius:16px;margin-bottom:16px}
input,select{width:100%;padding:13px;margin:7px 0 12px;border-radius:9px;border:1px solid #394765;background:#0d1527;color:white;font-size:16px}
.movie{padding:15px 0;border-bottom:1px solid #34405a}
.movie:last-child{border:0}
.movie h3{margin:0 0 8px}
.meta{color:#aab5cc;font-size:13px;margin-bottom:10px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions button{padding:8px 11px;font-size:13px}
.secondary{background:#34415c}
.danger{background:#a83250}
.hidden{display:none}
.empty{text-align:center;color:#aab5cc;padding:25px}
.stats{display:flex;gap:10px}
.stat{flex:1;text-align:center;background:#0d1527;padding:15px;border-radius:10px}
.stat b{display:block;font-size:25px;color:#a99aff}
small{color:#aab5cc}
</style>
</head>
<body>
<header>
<h1>🎬 Movie Finder</h1>
<p>כל הסרטים שלך במקום אחד</p>
</header>
<main>
<nav>
<button class="active" data-page="search">חיפוש</button>
<button data-page="manage">ניהול</button>
<button data-page="stats">סטטיסטיקה</button>
</nav>

<section id="search">
<div class="panel">
<h2>חיפוש סרט</h2>
<input id="query" placeholder="הקלד שם של סרט...">
</div>
<div class="panel" id="results"></div>
</section>

<section id="manage" class="hidden">
<div class="panel">
<h2 id="formTitle">הוספת סרט חדש</h2>
<input id="name" placeholder="שם הסרט">
<input id="link" placeholder="קישור לסרט">
<select id="genre">
<option value="">בחר ז'אנר</option>
<option>פעולה</option>
<option>קומדיה</option>
<option>דרמה</option>
<option>מתח</option>
<option>מדע בדיוני</option>
<option>אנימציה</option>
<option>אחר</option>
</select>
<select id="rating">
<option value="0">ללא דירוג</option>
<option value="1">★ 1</option>
<option value="2">★ 2</option>
<option value="3">★ 3</option>
<option value="4">★ 4</option>
<option value="5">★ 5</option>
</select>
<button id="save" style="width:100%">שמור סרט</button>
<button id="cancel" class="secondary hidden" style="width:100%;margin-top:8px">ביטול</button>
</div>
<div class="panel">
<h2>הספרייה שלי</h2>
<div id="manageList"></div>
</div>
</section>

<section id="stats" class="hidden">
<div class="panel">
<h2>הסטטיסטיקה שלי</h2>
<div class="stats">
<div class="stat"><b id="total">0</b><small>סרטים</small></div>
<div class="stat"><b id="favorites">0</b><small>מועדפים</small></div>
<div class="stat"><b id="rated">0</b><small>מדורגים</small></div>
</div>
</div>
</section>
</main>

<script>
const KEY="movieFinder_v1";
let movies=JSON.parse(localStorage.getItem(KEY)||"[]");
let editing=null;

const $=id=>document.getElementById(id);

function saveData(){
localStorage.setItem(KEY,JSON.stringify(movies));
render();
}

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function card(m,management=false){
return `<div class="movie">
<h3>${escapeHTML(m.name)} ${m.favorite?"⭐":""}</h3>
<div class="meta">${escapeHTML(m.genre||"ללא ז'אנר")} · ${m.rating?"★".repeat(m.rating):"ללא דירוג"}</div>
<div class="actions">
${m.link?`<button data-action="open" data-id="${m.id}">פתח קישור</button>`:""}
<button class="secondary" data-action="favorite" data-id="${m.id}">${m.favorite?"הסר ממועדפים":"מועדפים"}</button>
${management?`
<button class="secondary" data-action="edit" data-id="${m.id}">עריכה</button>
<button class="danger" data-action="delete" data-id="${m.id}">מחיקה</button>`:""}
</div></div>`;
}

function render(){
const q=$("query").value.toLowerCase().trim();
const found=movies.filter(m=>m.name.toLowerCase().includes(q));
$("results").innerHTML=found.length?found.map(m=>card(m)).join(''):'<div class="empty">לא נמצאו סרטים</div>';
$("manageList").innerHTML=movies.length?movies.map(m=>card(m,true)).join(''):'<div class="empty">הספרייה עדיין ריקה</div>';
$("total").textContent=movies.length;
$("favorites").textContent=movies.filter(m=>m.favorite).length;
$("rated").textContent=movies.filter(m=>m.rating>0).length;
}

function resetForm(){
editing=null;
$("name").value="";
$("link").value="";
$("genre").value="";
$("rating").value="0";
$("formTitle").textContent="הוספת סרט חדש";
$("save").textContent="שמור סרט";
$("cancel").classList.add("hidden");
}

$("save").onclick=()=>{
const name=$("name").value.trim();
const link=$("link").value.trim();
if(!name){alert("נא להזין שם סרט");return}
if(link&&!/^https?:\/\//i.test(link)){
alert("הקישור חייב להתחיל ב-http:// או https://");return;
}
const data={name,link,genre:$("genre").value,rating:Number($("rating").value)};
if(editing!==null){
movies=movies.map(m=>m.id===editing?{...m,...data}:m);
}else{
movies.push({id:Date.now().toString(),...data,favorite:false});
}
resetForm();
saveData();
alert("הסרט נשמר בהצלחה!");
};

$("cancel").onclick=resetForm;
$("query").oninput=render;

document.querySelectorAll("nav button").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
["search","manage","stats"].forEach(id=>$(id).classList.toggle("hidden",id!==btn.dataset.page));
render();
};
});

document.addEventListener("click",e=>{
const btn=e.target.closest("button[data-action]");
if(!btn)return;
const id=btn.dataset.id;
const m=movies.find(x=>x.id===id);
if(!m)return;

switch(btn.dataset.action){
case "open":
if(m.link)window.open(m.link,"_blank","noopener");
break;
case "favorite":
m.favorite=!m.favorite;
saveData();
break;
case "edit":
editing=id;
$("name").value=m.name;
$("link").value=m.link;
$("genre").value=m.genre;
$("rating").value=String(m.rating);
$("formTitle").textContent="עריכת סרט";
$("save").textContent="שמור שינויים";
$("cancel").classList.remove("hidden");
document.querySelector('[data-page="manage"]').click();
window.scrollTo(0,0);
break;
case "delete":
if(confirm("למחוק את הסרט?")){
movies=movies.filter(x=>x.id!==id);
saveData();
}
break;
}
});

render();
</script>
</body>
</html>
